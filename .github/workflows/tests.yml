name: Self-Healing Test Runner

on:
  workflow_dispatch:
    inputs:
      test_name:
        description: 'Test class to run'
        required: true
        default: 'testSelfHealing.SelfHealingTest'
      triggered_by:
        description: 'What triggered this run'
        required: false
        default: 'manual'
      pr_number:
        description: 'PR number if applicable'
        required: false

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: python_ai_analyzer

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Test
        run: |
          echo "🤖 Triggered by: ${{ github.event.inputs.triggered_by }}"
          echo "📋 PR Number: ${{ github.event.inputs.pr_number }}"
          echo "🧪 Running: ${{ github.event.inputs.test_name }}"
          mvn test -Dtest=${{ github.event.inputs.test_name }} -DfailIfNoTests=false